name: Bug report
description: Something is broken or unexpected in PrismNext
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — especially steps to reproduce.
        Security issues → see [SECURITY.md](https://github.com/yibocat/prismnext/blob/main/SECURITY.md) (private only).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PrismNext version
      description: e.g. 0.5.15 (About panel or GitHub Release tag)
      placeholder: "0.5.x"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - Other / unknown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional — paste relevant log snippets or attach screenshots (redact API keys).
    validations:
      required: false
