name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.14). Defaults to pushed tag or package.json version."
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
  PRISM_UPDATER_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

jobs:
  mac:
    name: Build macOS
    runs-on: macos-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "$TAG" != v* ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenCode binary
        shell: bash
        run: ./scripts/download-opencode.sh

      - name: Build app
        run: pnpm build

      - name: Package (macOS)
        shell: bash
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          pnpm exec electron-builder --mac --publish never --config.publish.url="$R2_PUBLIC_BASE_URL"

      - name: Capture artifact name
        id: artifact
        shell: bash
        run: |
          name="$(basename "$(ls dist/*.dmg | head -1)")"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o /tmp/AWSCLIV2.pkg
            sudo installer -pkg /tmp/AWSCLIV2.pkg -target /
          fi
          aws --version

      - name: Configure AWS CLI for R2
        shell: bash
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      # Only root-level installers / updater manifests — not mac-arm64/ or other unpack dirs.
      - name: Upload macOS artifacts to R2
        shell: bash
        env:
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          shopt -s nullglob
          for f in dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap; do
            aws s3 cp "$f" "s3://${{ secrets.R2_BUCKET }}/$(basename "$f")" \
              --endpoint-url "$ENDPOINT"
          done

      - name: Upload macOS artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: mac-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  win:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenCode binary
        shell: bash
        run: ./scripts/download-opencode.sh

      - name: Build app
        run: pnpm build

      - name: Package (Windows)
        shell: bash
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          pnpm exec electron-builder --win --publish never --config.publish.url="$R2_PUBLIC_BASE_URL"

      - name: Capture artifact name
        id: artifact
        shell: bash
        run: |
          name="$(basename "$(ls dist/*.exe | head -1)")"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/AWSCLIV2.msi" -o /tmp/AWSCLIV2.msi
            msiexec.exe /i /tmp/AWSCLIV2.msi /qn
            export PATH="/c/Program Files/Amazon/AWSCLIV2:$PATH"
          fi
          aws --version

      - name: Configure AWS CLI for R2
        shell: bash
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Upload Windows artifacts to R2
        shell: bash
        env:
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          shopt -s nullglob
          for f in dist/*.exe dist/*.yml dist/*.blockmap; do
            aws s3 cp "$f" "s3://${{ secrets.R2_BUCKET }}/$(basename "$f")" \
              --endpoint-url "$ENDPOINT"
          done

      - name: Upload Windows artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: win-release
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm libfuse2

      - name: Download OpenCode binary
        shell: bash
        run: ./scripts/download-opencode.sh

      - name: Build app
        run: pnpm build

      - name: Package (Linux)
        shell: bash
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          pnpm exec electron-builder --linux --publish never --config.publish.url="$R2_PUBLIC_BASE_URL"

      - name: Capture artifact name
        id: artifact
        shell: bash
        run: |
          name="$(basename "$(ls dist/*.AppImage | head -1)")"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Upload Linux artifacts to R2
        shell: bash
        env:
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          shopt -s nullglob
          for f in dist/*.AppImage dist/*.yml dist/*.blockmap; do
            aws s3 cp "$f" "s3://${{ secrets.R2_BUCKET }}/$(basename "$f")" \
              --endpoint-url "$ENDPOINT"
          done

      - name: Upload Linux artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish version.json + GitHub Release
    needs: [mac, win, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: mac-release
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: win-release
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: release-assets

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Write and upload version.json
        shell: bash
        env:
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VERSION: ${{ needs.mac.outputs.version }}
          MAC_ARTIFACT: ${{ needs.mac.outputs.artifact_name }}
          WIN_ARTIFACT: ${{ needs.win.outputs.artifact_name }}
          LINUX_ARTIFACT: ${{ needs.linux.outputs.artifact_name }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('version.json',JSON.stringify({version:process.env.VERSION,macUrl:\`\${process.env.R2_PUBLIC_BASE_URL}/\${process.env.MAC_ARTIFACT}\`,winUrl:\`\${process.env.R2_PUBLIC_BASE_URL}/\${process.env.WIN_ARTIFACT}\`,linuxUrl:\`\${process.env.R2_PUBLIC_BASE_URL}/\${process.env.LINUX_ARTIFACT}\`,notes:''},null,2));"
          cp version.json release-assets/version.json
          aws s3 cp version.json "s3://${{ secrets.R2_BUCKET }}/version.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json"

      # Body = changelog section for this version + fixed Downloads footer.
      # Series file: changelog/{major}.{minor}.x.md (e.g. 0.5.14 → 0.5.x.md, 2.1.0 → 2.1.x.md).
      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ needs.mac.outputs.version }}
          MAC_ARTIFACT: ${{ needs.mac.outputs.artifact_name }}
          WIN_ARTIFACT: ${{ needs.win.outputs.artifact_name }}
          LINUX_ARTIFACT: ${{ needs.linux.outputs.artifact_name }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          {
            echo "## What's new"
            echo ""
            node scripts/release/extract-changelog-section.mjs "$VERSION"
            echo ""
            echo "---"
            echo ""
            echo "## Downloads"
            echo ""
            echo "- **macOS:** \`${MAC_ARTIFACT}\`"
            echo "- **Windows:** \`${WIN_ARTIFACT}\`"
            echo "- **Linux:** \`${LINUX_ARTIFACT}\`"
            echo ""
            echo "Mirrored on R2 (in-app updates + download site):"
            echo ""
            echo "- version.json: ${R2_PUBLIC_BASE_URL}/version.json"
            echo ""
            echo "> Private repository: only collaborators can see this Release."
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.mac.outputs.tag }}
          name: prismnext ${{ needs.mac.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
