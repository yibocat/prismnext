<!DOCTYPE html><html><body>
<iframe id="f" src="/" style="width:390px;height:3000px;border:0"></iframe>
<pre id="out"></pre>
<script>
const f = document.getElementById('f');
f.onload = () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const rows = [];
    rows.push('clientWidth=' + d.documentElement.clientWidth + ' scrollWidth=' + d.documentElement.scrollWidth);
    const els = [...d.querySelectorAll('body *')];
    els.sort((a, b) => b.getBoundingClientRect().right - a.getBoundingClientRect().right);
    els.slice(0, 12).forEach(el => {
      const r = el.getBoundingClientRect();
      const cls = (el.className && el.className.baseVal !== undefined) ? el.className.baseVal : (el.className || '');
      rows.push(`${el.tagName}.${String(cls).split(' ')[0] || '(no-class)'} w=${Math.round(r.width)} right=${Math.round(r.right)}`);
    });
    document.getElementById('out').textContent = rows.join('\n');
  }, 3000);
};
</script></body></html>
