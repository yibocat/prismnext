appId: com.prism-next.app
productName: PrismNext
directories:
  output: dist

asarUnpack:
  - "**/node_modules/node-pty/**"

# Shared app assets (all platforms).
extraResources:
  - from: "resources"
    to: "resources"

# OpenCode agent binary — one platform per build.
# Layout matches resolveOpencodeBinaryPath():
#   Packaged → <resources>/opencode/opencode[.exe]
#   Dev      → bin/opencode/<platform>-<arch>/opencode[.exe]
# Folder names: darwin | linux | windows  (not electron-builder's mac/win macros).
mac:
  icon: resources/brand/icon.icns
  # dmg = human download; zip = electron-updater (generic provider requires zip on macOS)
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extraResources:
    - from: "bin/opencode/darwin-${arch}/"
      to: "opencode"
      filter:
        - "opencode*"

win:
  # Generated from app-icon-dark.png (Pillow). Falls back to PNG if missing.
  icon: resources/brand/icon.ico
  target:
    - nsis
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extraResources:
    - from: "bin/opencode/windows-${arch}/"
      to: "opencode"
      filter:
        - "opencode*"

linux:
  icon: resources/brand/app-icon-dark.png
  target:
    - AppImage
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extraResources:
    - from: "bin/opencode/linux-${arch}/"
      to: "opencode"
      filter:
        - "opencode*"

# CI must pass --config.publish.url="$R2_PUBLIC_BASE_URL" (Task 4).
# Local dist:* uses --publish never — no upload.
publish:
  provider: generic
  url: https://REPLACE_WITH_R2_PUBLIC_BASE_URL
  channel: latest
