appId: com.prism-next.app
productName: Prism Next
directories:
  output: dist

asarUnpack:
  - "**/node_modules/node-pty/**"

extraResources:
  - from: "bin/opencode/darwin-${arch}/"
    to: "opencode"
    filter:
      - "opencode*"
  - from: "resources"
    to: "resources"

mac:
  target:
    - dmg
  artifactName: "${productName}-${version}-${arch}.${ext}"

win:
  target:
    - nsis
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  target:
    - AppImage
  artifactName: "${productName}-${version}-${arch}.${ext}"
