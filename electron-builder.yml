appId: com.prism-next.app
productName: PrismNext
directories:
  output: dist

asarUnpack:
  - "**/node_modules/node-pty/**"
  # font-list: macOS helper binary + Windows VBS must run outside asar
  - "**/node_modules/font-list/**"

# Shared app assets (all platforms).
extraResources:
  - from: "resources"
    to: "resources"
  # Host runtime pushed over SSH (D19). Run `pnpm host:pack` before dist.
  - from: "out/host"
    to: "host"
    filter:
      - "prismnext-host.tar.gz"
      - "prismnext-host-*.tar.gz"
      - "current/**"

# Tectonic LaTeX engine — one platform per build.
# Layout matches resolveBundledTectonicBinaryPath():
#   Packaged → <resources>/tectonic/tectonic[.exe]
#   Dev      → bin/tectonic/<platform>-<arch>/tectonic[.exe]
# Folder names: darwin | linux | windows  (not electron-builder's mac/win macros).
# Typst CLI — same layout under <resources>/typst and bin/typst/<platform>-<arch>/.
mac:
  icon: resources/brand/icon.icns
  # dmg = human download; zip = electron-updater (generic provider requires zip on macOS)
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extraResources:
    - from: "bin/tectonic/darwin-${arch}/"
      to: "tectonic"
      filter:
        - "tectonic*"
    - from: "bin/typst/darwin-${arch}/"
      to: "typst"
      filter:
        - "typst*"

win:
  # Generated from app-icon-dark.png (Pillow). Falls back to PNG if missing.
  icon: resources/brand/icon.ico
  target:
    - nsis
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extraResources:
    - from: "bin/tectonic/windows-${arch}/"
      to: "tectonic"
      filter:
        - "tectonic*"
    - from: "bin/typst/windows-${arch}/"
      to: "typst"
      filter:
        - "typst*"

linux:
  icon: resources/brand/app-icon-dark.png
  target:
    - AppImage
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extraResources:
    - from: "bin/tectonic/linux-${arch}/"
      to: "tectonic"
      filter:
        - "tectonic*"
    - from: "bin/typst/linux-${arch}/"
      to: "typst"
      filter:
        - "typst*"

# CI may override with --config.publish.url="$R2_PUBLIC_BASE_URL".
# Local dist:* uses --publish never — no upload.
publish:
  provider: generic
  url: https://pub-c529ea6125f74485bddd4d8e4cfd2d44.r2.dev
  channel: latest
