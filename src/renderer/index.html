<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrismNext</title>
    <script>
      // ── Theme detection (runs before first paint) ──
      (function () {
        var stored = localStorage.getItem("theme");
        var isLight =
          stored === "light" ||
          (stored !== "dark" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute(
          "data-splash-theme",
          isLight ? "light" : "dark",
        );
        // ?freeze-splash keeps the splash visible for design iteration
        window.__FREEZE_SPLASH__ =
          new URLSearchParams(window.location.search).has("freeze-splash");
      })();
    </script>
    <style>
      /* ── Splash screen ── */
      :root {
        --splash-bg: #141415;
        --splash-text: rgba(255, 255, 255, 0.9);
        --splash-bar-bg: rgba(255, 255, 255, 0.1);
        --splash-bar-fg: rgba(255, 255, 255, 0.45);
        /* P5 Warm Graphite — dark surface */
        --splash-ribbon-face: #f5ede4;
        --splash-ribbon-under: #e8a85a;
        --splash-ribbon-shadow: #000000;
        --splash-ribbon-shadow-opacity: 0.55;
        --splash-mark-plate: rgba(255, 255, 255, 0.06);
        --splash-mark-border: rgba(255, 255, 255, 0.12);
      }
      [data-splash-theme="light"] {
        --splash-bg: #f8f8f8;
        --splash-text: rgba(0, 0, 0, 0.8);
        --splash-bar-bg: rgba(0, 0, 0, 0.1);
        --splash-bar-fg: rgba(0, 0, 0, 0.35);
        /* P5 Warm Graphite — light surface */
        --splash-ribbon-face: #2c2825;
        --splash-ribbon-under: #c9853e;
        --splash-ribbon-shadow: #1a1714;
        --splash-ribbon-shadow-opacity: 0.45;
        --splash-mark-plate: #ffffff;
        --splash-mark-border: rgba(0, 0, 0, 0.08);
      }

      #L {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: var(--splash-bg);
      }
      #L.hide { display: none; }

      #L .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #L .splash-mark-plate {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--splash-mark-plate);
        border: 1px solid var(--splash-mark-border);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      #L .splash-mark {
        width: 32px;
        height: 32px;
        display: block;
      }

      #L .splash-name {
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.4px;
        color: var(--splash-text);
      }

      #L .splash-bar {
        width: 160px; height: 3px;
        margin-top: 4px;
        background: var(--splash-bar-bg);
        border-radius: 2px;
        overflow: hidden;
      }

      #L .splash-bar-fill {
        height: 100%; width: 35%;
        background: var(--splash-bar-fg);
        border-radius: 2px;
        animation: splash-slide 1.5s ease-in-out infinite;
      }

      @keyframes splash-slide {
        0%   { transform: translateX(-100%); }
        55%  { transform: translateX(220%); }
        100% { transform: translateX(220%); }
      }
    </style>
  </head>
  <body class="h-full antialiased">
    <div id="L">
      <div class="splash-inner">
        <div class="splash-mark-plate" aria-hidden="true">
          <!-- Variant A · P5 ribbon — colors via CSS vars (light/dark splash theme) -->
          <svg class="splash-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(32 32) scale(1.18) translate(-32 -32)">
              <g transform="translate(1.4 1.9)" opacity="var(--splash-ribbon-shadow-opacity)">
                <path d="M26 31c4.5 5 7.5 10 12.5 12h15" stroke="var(--splash-ribbon-shadow)" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 35c10 0 14-1.5 18-5 4.5-4 7-7.5 11-7.5h17" stroke="var(--splash-ribbon-shadow)" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
              <path d="M26 31c4.5 5 7.5 10 12.5 12h15" stroke="var(--splash-ribbon-under)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 35c10 0 14-1.5 18-5 4.5-4 7-7.5 11-7.5h17" stroke="var(--splash-ribbon-face)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        <div class="splash-name">PrismNext</div>
        <div class="splash-bar">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
