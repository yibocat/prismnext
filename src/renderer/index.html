<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism Next</title>
    <script>
      // ── Theme detection (runs before first paint) ──
      (function () {
        var stored = localStorage.getItem("theme");
        var isLight =
          stored === "light" ||
          (stored !== "dark" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute(
          "data-splash-theme",
          isLight ? "light" : "dark",
        );
        // ?freeze-splash keeps the splash visible for design iteration
        window.__FREEZE_SPLASH__ =
          new URLSearchParams(window.location.search).has("freeze-splash");
      })();
    </script>
    <style>
      /* ── Splash screen ── */
      :root {
        --splash-bg: #141415;
        --splash-text: rgba(255, 255, 255, 0.9);
        --splash-bar-bg: rgba(255, 255, 255, 0.1);
        --splash-bar-fg: rgba(255, 255, 255, 0.45);
      }
      [data-splash-theme="light"] {
        --splash-bg: #f8f8f8;
        --splash-text: rgba(0, 0, 0, 0.8);
        --splash-bar-bg: rgba(0, 0, 0, 0.1);
        --splash-bar-fg: rgba(0, 0, 0, 0.35);
      }

      #L {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: var(--splash-bg);
      }
      #L.hide { display: none; }

      #L .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      #L .splash-name {
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: var(--splash-text);
      }

      #L .splash-bar {
        width: 180px; height: 3px;
        background: var(--splash-bar-bg);
        border-radius: 2px;
        overflow: hidden;
      }

      #L .splash-bar-fill {
        height: 100%; width: 35%;
        background: var(--splash-bar-fg);
        border-radius: 2px;
        animation: splash-slide 1.5s ease-in-out infinite;
      }

      @keyframes splash-slide {
        0%   { transform: translateX(-100%); }
        55%  { transform: translateX(220%); }
        100% { transform: translateX(220%); }
      }
    </style>
  </head>
  <body class="h-full antialiased">
    <div id="L">
      <div class="splash-inner">
        <div class="splash-name">Prism</div>
        <div class="splash-bar">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
