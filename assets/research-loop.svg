<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" fill="none">
  <!-- Research loop, journal style: seven beats on a rule, review arcs back. -->
  <rect x="0.5" y="0.5" width="959" height="219" rx="8" fill="#FFFDF6" stroke="#E6DECB"/>

  <text x="40" y="36" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="3.5" fill="#A33D2F">THE AI RESEARCH LOOP</text>
  <line x1="40" y1="48" x2="920" y2="48" stroke="#E2DAC5" stroke-width="1"/>

  <!-- beats -->
  <g text-anchor="middle">
    <text x="82" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">01</text>
    <text x="82" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Ideate</text>
    <text x="82" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Brainstorm · Ledger</text>

    <text x="208" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">02</text>
    <text x="208" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Read</text>
    <text x="208" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Library · PDF · Cite</text>

    <text x="334" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">03</text>
    <text x="334" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Think</text>
    <text x="334" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Notes · Critique</text>

    <text x="460" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">04</text>
    <text x="460" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Design</text>
    <text x="460" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Brief · Plan</text>

    <text x="586" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">05</text>
    <text x="586" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Run</text>
    <text x="586" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Runs · Provenance</text>

    <text x="712" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">06</text>
    <text x="712" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Write</text>
    <text x="712" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">LaTeX · Typst</text>

    <text x="858" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">07</text>
    <text x="858" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1A15">Review</text>
    <text x="858" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Diff · Gates</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#C9BFA4" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M136 118 H184 M178 113 L184 118 L178 123"/>
    <path d="M262 118 H310 M304 113 L310 118 L304 123"/>
    <path d="M388 118 H436 M430 113 L436 118 L430 123"/>
    <path d="M514 118 H562 M556 113 L562 118 L556 123"/>
    <path d="M640 118 H688 M682 113 L688 118 L682 123"/>
    <path d="M766 118 H814 M808 113 L814 118 L808 123"/>
  </g>

  <!-- review arcs back to read -->
  <path d="M858 158 C 858 196, 208 196, 208 162" stroke="#8F6B1F" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>
  <path d="M203 170 L208 162 L213 170" stroke="#8F6B1F" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <text x="470" y="212" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F6B1F">review feeds the next pass — autonomous or side-by-side, you stay in the loop</text>
</svg>
