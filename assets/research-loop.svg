<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" fill="none">
  <!-- Manuscript-style research loop: five beats on a rule, review arcs back. -->
  <rect x="0.5" y="0.5" width="959" height="219" rx="6" fill="#FBF7EC" stroke="#C9BFA4"/>

  <text x="40" y="36" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="3.5" fill="#9B9178">THE RESEARCH LOOP</text>
  <line x1="40" y1="48" x2="920" y2="48" stroke="#D9CFB6" stroke-width="1"/>

  <!-- beats -->
  <g text-anchor="middle">
    <text x="110" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3B6FD4">01</text>
    <text x="110" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1D1A13">Literature</text>
    <text x="110" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#6D6552">Library · PDF · Cite</text>

    <text x="290" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3B6FD4">02</text>
    <text x="290" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1D1A13">Design</text>
    <text x="290" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#6D6552">Brief · Plan</text>

    <text x="470" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3B6FD4">03</text>
    <text x="470" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1D1A13">Experiments</text>
    <text x="470" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#6D6552">Runs · Provenance</text>

    <text x="650" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3B6FD4">04</text>
    <text x="650" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1D1A13">Writing</text>
    <text x="650" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#6D6552">LaTeX · Preview</text>

    <text x="830" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3B6FD4">05</text>
    <text x="830" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1D1A13">Review</text>
    <text x="830" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#6D6552">Diff · Gates</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#B3A888" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M164 118 H228 M222 113 L228 118 L222 123"/>
    <path d="M344 118 H408 M402 113 L408 118 L402 123"/>
    <path d="M524 118 H588 M582 113 L588 118 L582 123"/>
    <path d="M704 118 H768 M762 113 L768 118 L762 123"/>
  </g>

  <!-- review arcs back to literature -->
  <path d="M830 158 C 830 192, 110 192, 110 160" stroke="#5468A8" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>
  <path d="M105 166 L110 158 L115 166" stroke="#5468A8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <text x="470" y="210" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#5468A8">review feeds the next pass — you stay in the loop</text>
</svg>
