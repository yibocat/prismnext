<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" fill="none">
  <!-- 科研闭环，期刊风：七个节拍 + 审阅回流虚线 -->
  <rect x="0.5" y="0.5" width="959" height="219" rx="8" fill="#FFFDF6" stroke="#E6DECB"/>

  <text x="40" y="36" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="6" fill="#A33D2F">AI 科研闭环</text>
  <line x1="40" y1="48" x2="920" y2="48" stroke="#E2DAC5" stroke-width="1"/>

  <!-- 七个节拍 -->
  <g text-anchor="middle">
    <text x="82" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">01</text>
    <text x="82" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">构思</text>
    <text x="82" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">脑暴 · 账本</text>

    <text x="208" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">02</text>
    <text x="208" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">阅读</text>
    <text x="208" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">文献库 · PDF · 引用</text>

    <text x="334" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">03</text>
    <text x="334" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">思考</text>
    <text x="334" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">笔记 · 批判</text>

    <text x="460" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">04</text>
    <text x="460" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">设计</text>
    <text x="460" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">Brief · Plan</text>

    <text x="586" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">05</text>
    <text x="586" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">运行</text>
    <text x="586" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">实验 · 溯源</text>

    <text x="712" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">06</text>
    <text x="712" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">写作</text>
    <text x="712" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">LaTeX · Typst</text>

    <text x="858" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#A33D2F">07</text>
    <text x="858" y="126" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#1C1A15">审阅</text>
    <text x="858" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#8F8672">改动 · 闸门</text>
